function copyBlock(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText.trim()).then(() => {
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Copied';
    setTimeout(() => { btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy'; }, 2000);
  });
}

const nav = document.getElementById('nav');
const sectionsDiv = document.getElementById('sections');

sections.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
  btn.innerHTML = `<span class="num"><i class="ti ${s.icon}" aria-hidden="true"></i> S${s.id}</span>${s.short}`;
  btn.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(sc => sc.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-' + s.id).classList.add('active');
  };
  nav.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'section' + (i === 0 ? ' active' : '');
  div.id = 'sec-' + s.id;
  div.innerHTML = s.content;
  sectionsDiv.appendChild(div);
});
</script>
