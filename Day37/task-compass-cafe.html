<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass — Café Edition</title>
<style>
  :root{
    --bg-0:#1b1410;
    --bg-1:#241a14;
    --panel:rgba(255,247,237,0.05);
    --panel-border:rgba(255,247,237,0.10);
    --cream:#f3e6d3;
    --espresso:#3b2417;
    --gold:#d9a441;
    --steam:#7fb8a8;
    --clay:#c1613f;
    --plum:#8a5a8f;
    --slate:#5c7d9a;
    --ok:#7fb8a8;
    --warn:#d9a441;
    --danger:#c1613f;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--cream);
    background:
      radial-gradient(circle at 15% 10%, rgba(217,164,65,0.14), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(193,97,63,0.16), transparent 50%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1) 60%, #150f0b);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  .steam-layer{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
    background-image:
      radial-gradient(ellipse 200px 400px at 10% 100%, rgba(127,184,168,0.07), transparent 70%),
      radial-gradient(ellipse 250px 500px at 90% 100%, rgba(217,164,65,0.06), transparent 70%);
  }
  #app{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  header.hero{
    text-align:center; padding:36px 10px 22px; position:relative;
  }
  .brand-mark{
    display:inline-flex; align-items:center; gap:10px;
    font-size:13px; letter-spacing:3px; text-transform:uppercase;
    color:var(--gold); opacity:0.9; margin-bottom:10px;
  }
  .brand-mark::before, .brand-mark::after{content:"—"; opacity:0.5;}
  h1.title{
    font-family:Georgia, 'Times New Roman', serif;
    font-size:clamp(2.1rem, 5vw, 3.4rem);
    margin:0; font-weight:700;
    background:linear-gradient(100deg, var(--cream), var(--gold) 55%, var(--clay));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:200% auto; animation:shimmer 8s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{background-position:0% center;}50%{background-position:100% center;}}
  .subtitle{color:rgba(243,230,211,0.65); font-size:1.02rem; margin-top:10px; font-style:italic;}
  .scenario-tag{
    display:inline-block; margin-top:14px; padding:6px 16px; border-radius:999px;
    background:var(--panel); border:1px solid var(--panel-border); font-size:0.82rem; letter-spacing:1px;
    text-transform:uppercase; color:var(--steam);
  }

  /* ---------- Progress ---------- */
  .progress-wrap{margin:26px auto 8px; max-width:640px;}
  .progress-track{
    display:flex; gap:8px; align-items:center;
  }
  .stage-pip{
    flex:1; height:8px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; position:relative;
  }
  .stage-pip .fill{
    position:absolute; inset:0; width:0%; border-radius:6px;
    background:linear-gradient(90deg, var(--gold), var(--clay));
    transition:width 0.6s cubic-bezier(.4,0,.2,1);
  }
  .progress-labels{display:flex; justify-content:space-between; font-size:0.72rem; letter-spacing:1px; text-transform:uppercase; color:rgba(243,230,211,0.5); margin-top:8px;}

  /* ---------- Cards / panels ---------- */
  .panel{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding:26px; margin-top:22px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    animation:rise 0.5s ease both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}

  .ticket{
    background:linear-gradient(145deg, rgba(255,247,237,0.07), rgba(255,247,237,0.02));
    border:1px dashed rgba(217,164,65,0.4);
    border-radius:14px; padding:20px 22px; position:relative; margin-bottom:22px;
  }
  .ticket::before{
    content:"☕ ORDER TICKET"; position:absolute; top:-11px; left:18px; font-size:0.68rem;
    letter-spacing:2px; background:var(--bg-1); padding:2px 10px; color:var(--gold); border-radius:6px;
  }
  .ticket p{margin:0; font-size:1.12rem; line-height:1.5; color:var(--cream);}

  /* Role cards */
  .role-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; margin-top:6px;}
  .role-card{
    cursor:grab; user-select:none; padding:16px 12px; border-radius:14px; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid var(--panel-border); transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    position:relative;
  }
  .role-card:hover{transform:translateY(-4px) scale(1.02); border-color:var(--gold); box-shadow:0 10px 24px rgba(217,164,65,0.18);}
  .role-card.dragging{opacity:0.35;}
  .role-card .emoji{font-size:1.8rem; display:block; margin-bottom:6px;}
  .role-card .name{font-size:0.86rem; font-weight:600;}
  .role-card.used{opacity:0.3; pointer-events:none;}
  .role-card.selected{border-color:var(--steam); box-shadow:0 0 0 2px var(--steam) inset;}

  /* Ownership slot */
  .drop-zone{
    margin-top:20px; min-height:96px; border-radius:14px; border:2px dashed rgba(217,164,65,0.45);
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    background:rgba(217,164,65,0.04); transition:background .2s ease, border-color .2s ease; padding:12px;
  }
  .drop-zone.hover{background:rgba(217,164,65,0.12); border-color:var(--gold);}
  .drop-zone .hint{color:rgba(243,230,211,0.45); font-size:0.9rem;}
  .drop-zone .placed{animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(0.7); opacity:0;}100%{transform:scale(1); opacity:1;}}

  /* Workflow (stage 2) */
  .workflow-track{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:90px;
    border-radius:14px; border:2px dashed rgba(127,184,168,0.4); background:rgba(127,184,168,0.05);
    padding:14px; margin-top:16px;
  }
  .workflow-track .step-chip{
    display:flex; align-items:center; gap:8px; background:var(--espresso); border:1px solid var(--gold);
    padding:8px 12px; border-radius:10px; font-size:0.85rem; animation:pop .3s ease;
  }
  .workflow-track .arrow{color:var(--steam); font-size:1.1rem;}
  .workflow-track .remove-x{cursor:pointer; opacity:0.6; margin-left:4px;}
  .workflow-track .remove-x:hover{opacity:1; color:var(--danger);}

  /* Collaboration (stage 3) multi-select */
  .role-card.collab-selected{border-color:var(--clay); box-shadow:0 0 0 2px var(--clay) inset;}
  .collab-counter{margin-top:10px; font-size:0.85rem; color:rgba(243,230,211,0.6);}

  /* Buttons */
  .btn-row{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:12px; padding:13px 26px;
    font-size:0.95rem; font-weight:600; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button.primary{
    background:linear-gradient(120deg, var(--gold), var(--clay)); color:#1b1410;
    box-shadow:0 8px 20px rgba(217,164,65,0.25);
  }
  button.primary:disabled{opacity:0.35; cursor:not-allowed; box-shadow:none;}
  button.primary:not(:disabled):hover{transform:translateY(-2px);}
  button.ghost{background:transparent; border:1px solid var(--panel-border); color:var(--cream);}
  button.ghost:hover{border-color:var(--gold);}

  /* Feedback */
  .feedback{
    margin-top:22px; padding:20px 22px; border-radius:14px; border:1px solid var(--panel-border);
    background:rgba(127,184,168,0.07); animation:rise .5s ease both;
  }
  .feedback h3{margin:0 0 8px; font-size:1.05rem; color:var(--steam);}
  .feedback .row{margin-top:10px; font-size:0.92rem; line-height:1.5;}
  .feedback .row b{color:var(--gold);}
  .assist-tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .assist-tags span{background:rgba(255,255,255,0.06); border:1px solid var(--panel-border); padding:4px 10px; border-radius:999px; font-size:0.78rem;}

  /* Flow animation stage 2 result */
  .flow-anim{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:14px;}
  .flow-anim .node{
    background:var(--espresso); border:1px solid var(--gold); padding:8px 12px; border-radius:10px; font-size:0.82rem;
    opacity:0; transform:translateX(-10px); animation:flowIn .45s ease forwards;
  }
  @keyframes flowIn{to{opacity:1; transform:translateX(0);}}
  .flow-anim .arrow{color:var(--steam); opacity:0; animation:flowIn .45s ease forwards;}

  /* Intro screen */
  .intro-panel{text-align:center;}
  .intro-panel h2{font-family:Georgia, serif; font-size:1.6rem; margin-bottom:10px;}
  .stage-list{display:grid; gap:14px; margin:22px 0; text-align:left;}
  .stage-item{
    display:flex; gap:14px; align-items:flex-start; padding:16px; border-radius:14px;
    background:rgba(255,255,255,0.04); border:1px solid var(--panel-border);
  }
  .stage-item .num{font-family:Georgia,serif; font-size:1.6rem; color:var(--gold); min-width:36px;}
  .stage-item h4{margin:0 0 4px; font-size:1rem;}
  .stage-item p{margin:0; font-size:0.86rem; color:rgba(243,230,211,0.6);}

  /* Results */
  .chart{display:grid; gap:14px; margin-top:20px;}
  .bar-row{display:grid; grid-template-columns:150px 1fr 50px; align-items:center; gap:12px;}
  .bar-row .label{font-size:0.86rem; color:rgba(243,230,211,0.75);}
  .bar-track{height:14px; border-radius:8px; background:rgba(255,255,255,0.06); overflow:hidden;}
  .bar-fill{height:100%; width:0%; border-radius:8px; transition:width 1.1s cubic-bezier(.2,.9,.25,1);}
  .bar-row .pct{font-size:0.8rem; text-align:right; color:rgba(243,230,211,0.6);}

  .reflection-grid{display:grid; gap:14px; margin-top:20px; grid-template-columns:1fr 1fr;}
  @media (max-width:640px){.reflection-grid{grid-template-columns:1fr;}}
  .reflect-card{background:rgba(255,255,255,0.04); border:1px solid var(--panel-border); border-radius:14px; padding:16px;}
  .reflect-card h4{margin:0 0 8px; font-size:0.92rem; display:flex; align-items:center; gap:8px;}
  .reflect-card p{margin:0; font-size:0.86rem; line-height:1.5; color:rgba(243,230,211,0.75);}
  .insight-banner{
    margin-top:20px; padding:18px 20px; border-radius:14px; text-align:center; font-style:italic;
    background:linear-gradient(120deg, rgba(217,164,65,0.14), rgba(193,97,63,0.14)); border:1px solid var(--panel-border);
  }

  .confetti{position:fixed; top:-10px; z-index:5; pointer-events:none; border-radius:2px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg); opacity:0.2;}}

  .restart-note{text-align:center; margin-top:26px; color:rgba(243,230,211,0.4); font-size:0.8rem;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(217,164,65,0.3); border-radius:6px;}
</style>
</head>
<body>
<div class="steam-layer"></div>
<div id="app"></div>

<script>
/* ======================= DATA ======================= */
const ROLES = [
  {id:'barista', name:'Barista', emoji:'☕'},
  {id:'server', name:'Server', emoji:'🧑‍🍳'},
  {id:'kitchen', name:'Kitchen / Chef', emoji:'🍳'},
  {id:'manager', name:'Restaurant Manager', emoji:'📋'},
  {id:'host', name:'Host / Hostess', emoji:'🚪'},
  {id:'busser', name:'Busser / Dishwasher', emoji:'🍽️'},
  {id:'owner', name:'Owner', emoji:'🏠'},
  {id:'supplier', name:'Supplier Relations', emoji:'🚚'}
];
const R = id => ROLES.find(r=>r.id===id);

const STAGE1 = [
  {
    task:"A customer says their latte tastes burnt this morning.",
    owner:'barista',
    why:"The barista makes every espresso-based drink, so they're closest to what actually happened at the machine — over-extraction, wrong temperature, or old beans.",
    assist:['manager','kitchen']
  },
  {
    task:"A table says their food order came out wrong — they ordered a veggie wrap, not a chicken one.",
    owner:'server',
    why:"The server took the order and is the customer's point of contact, so they own getting it corrected quickly, even if the kitchen made the actual mistake.",
    assist:['kitchen','host']
  },
  {
    task:"The café runs out of clean coffee cups during the Saturday morning rush.",
    owner:'busser',
    why:"Keeping dishware flowing is the busser/dishwasher's core responsibility — it's a supply-of-clean-items problem, not a service or recipe problem.",
    assist:['manager','barista']
  },
  {
    task:"A regular customer wants to know if the café can accommodate a gluten-free diet.",
    owner:'kitchen',
    why:"The kitchen knows the ingredients and cross-contamination risks in every dish, making them the authority on dietary accommodations.",
    assist:['server','manager']
  },
  {
    task:"A walk-in party of 12 shows up with no reservation on a busy Friday night.",
    owner:'host',
    why:"Seating and table flow decisions belong to the host — they see the whole floor and know what's realistic right now.",
    assist:['manager','server']
  },
  {
    task:"A supplier delivers produce that looks spoiled.",
    owner:'kitchen',
    why:"The kitchen inspects ingredient quality before anything is cooked, so they're first to catch and flag a bad delivery.",
    assist:['supplier','manager']
  },
  {
    task:"Monthly profit margins are shrinking even though sales look steady.",
    owner:'owner',
    why:"Overall financial health — pricing, costs, and margins — is a business-level concern that sits with the owner.",
    assist:['manager','supplier']
  },
  {
    task:"A customer leaves a generous cash tip and asks that it go directly to their server.",
    owner:'server',
    why:"The server earned and is entitled to a tip left specifically for them; it's a direct, personal transaction.",
    assist:['manager']
  }
];

const STAGE2 = [
  {
    task:"A customer wants to send back an overcooked steak.",
    correct:['server','kitchen','server','host'],
    minLen:3,
    why:"The server carries the concern to the kitchen (who can actually fix the food), then brings the corrected dish back — the host may check satisfaction on the way out."
  },
  {
    task:"A regular customer requests a custom off-menu dish for a birthday event next week.",
    correct:['host','manager','kitchen','server'],
    minLen:3,
    why:"Special requests usually get logged at the host stand, approved by a manager who can commit resources, built by the kitchen, then delivered by the server on the day."
  },
  {
    task:"A supplier delivers spoiled produce right before the lunch rush.",
    correct:['kitchen','manager','supplier'],
    minLen:3,
    why:"The kitchen flags the problem first since they inspect ingredients, the manager decides how to handle the shortage, and the supplier is contacted to resolve the delivery."
  }
];

const STAGE3 = [
  {
    scenario:"Customer satisfaction ratings have dropped noticeably this month.",
    primary:'manager',
    supporting:['server','kitchen','host'],
    reasoning:"A drop in overall satisfaction usually has more than one cause — slow seating, service pace, or food quality — so the manager coordinates input from the floor and kitchen before acting.",
    flow:"Manager reviews reviews & feedback → checks in with Host on wait times → checks in with Server on service pace → checks in with Kitchen on ticket times → manager sets an action plan."
  },
  {
    scenario:"A customer's photo of your latte art goes viral online overnight.",
    primary:'owner',
    supporting:['barista','manager','server'],
    reasoning:"Sudden attention is a business opportunity — the owner decides how to capitalize on it, the barista who made the drink becomes part of the story, and staff need to be ready for the traffic spike.",
    flow:"Owner spots the spike → loops in Manager to prep staffing → Barista is briefed on repeating the drink → Server team is told to expect a rush."
  },
  {
    scenario:"New reviews mention slow service specifically during weekend brunch.",
    primary:'manager',
    supporting:['host','server','kitchen'],
    reasoning:"Slow service during a specific window is a workflow bottleneck that could sit at seating, table service, or the kitchen — the manager investigates all three before changing anything.",
    flow:"Manager reads the pattern in reviews → Host checks seating pace → Server checks table turnover → Kitchen checks ticket times → manager identifies the real bottleneck."
  }
];

/* ======================= STATE ======================= */
let state = {
  screen:'intro',
  stage:1,
  s1Index:0, s2Index:0, s3Index:0,
  scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
  scoreMax:{ownership:0, delegation:0, collaboration:0, workflow:0},
  overAssignCount:0, underCollabCount:0,
  s2Selection:[], s3Selection:[],
  s1Placed:null,
  answered:false
};

const app = document.getElementById('app');

/* ======================= RENDER HELPERS ======================= */
function progressHTML(){
  const stageProgress = [
    Math.min(state.s1Index/3,1),
    Math.min(state.s2Index/3,1),
    Math.min(state.s3Index/3,1)
  ];
  const labels = ['Ownership','Routing','Collaboration'];
  return `<div class="progress-wrap">
    <div class="progress-track">
      ${stageProgress.map(p=>`<div class="stage-pip"><div class="fill" style="width:${p*100}%"></div></div>`).join('')}
    </div>
    <div class="progress-labels">${labels.map(l=>`<span>${l}</span>`).join('')}</div>
  </div>`;
}

function header(tag){
  return `<header class="hero">
    <div class="brand-mark">Café Edition</div>
    <h1 class="title">Task Compass</h1>
    <p class="subtitle">Learn how work flows through real organizations.</p>
    ${tag ? `<div class="scenario-tag">${tag}</div>` : ''}
    ${state.screen!=='intro' && state.screen!=='results' ? progressHTML() : ''}
  </header>`;
}

function roleCardHTML(role, extraClass, draggable){
  return `<div class="role-card ${extraClass||''}" data-role="${role.id}" ${draggable?'draggable="true"':''}>
    <span class="emoji">${role.emoji}</span>
    <span class="name">${role.name}</span>
  </div>`;
}

/* ======================= INTRO ======================= */
function renderIntro(){
  app.innerHTML = `
    ${header()}
    <div class="panel intro-panel">
      <h2>Welcome to the floor of a café ☕</h2>
      <p style="color:rgba(243,230,211,0.7); max-width:560px; margin:0 auto;">
        You'll manage real situations from a café / restaurant — who owns them, how work moves between people, and when a problem needs a whole team.
      </p>
      <div class="stage-list">
        <div class="stage-item"><div class="num">1</div><div><h4>Who Owns This?</h4><p>Drag the right role into the ownership slot for each ticket.</p></div></div>
        <div class="stage-item"><div class="num">2</div><div><h4>Task Routing</h4><p>Build the order in which a task moves through the team.</p></div></div>
        <div class="stage-item"><div class="num">3</div><div><h4>Collaboration Challenge</h4><p>Bigger problems need more than one owner — assign up to four roles.</p></div></div>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="primary" onclick="startGame()">Start Shift →</button>
      </div>
    </div>
  `;
}
function startGame(){ state.screen='stage1'; state.s1Placed=null; state.answered=false; renderStage1(); }

/* ======================= STAGE 1 ======================= */
function renderStage1(){
  const item = STAGE1[state.s1Index % STAGE1.length];
  app.innerHTML = `
    ${header(`Stage 1 · Who Owns This? · ${state.s1Index+1} / 3`)}
    <div class="panel">
      <div class="ticket"><p>${item.task}</p></div>
      <div class="role-grid" id="roleGrid">
        ${ROLES.map(r=>roleCardHTML(r,'', !state.answered)).join('')}
      </div>
      <div class="drop-zone" id="dropZone">
        <span class="hint" id="dropHint">Drag a role here to claim ownership</span>
      </div>
      <div class="btn-row">
        <button class="primary" id="submitBtn" disabled onclick="submitStage1()">Submit Ownership</button>
      </div>
      <div id="feedbackArea"></div>
    </div>
  `;
  setupStage1DnD(item);
}

function setupStage1DnD(item){
  const grid = document.getElementById('roleGrid');
  const zone = document.getElementById('dropZone');
  const hint = document.getElementById('dropHint');
  const submitBtn = document.getElementById('submitBtn');

  grid.querySelectorAll('.role-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.dataset.role);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    // mobile/click fallback
    card.addEventListener('click', ()=>{
      if(state.answered) return;
      placeRole(card.dataset.role);
    });
  });

  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('hover'); });
  zone.addEventListener('dragleave', ()=> zone.classList.remove('hover'));
  zone.addEventListener('drop', e=>{
    e.preventDefault(); zone.classList.remove('hover');
    const roleId = e.dataTransfer.getData('text/plain');
    placeRole(roleId);
  });

  function placeRole(roleId){
    state.s1Placed = roleId;
    const role = R(roleId);
    hint.style.display='none';
    zone.querySelectorAll('.placed').forEach(n=>n.remove());
    const chip = document.createElement('div');
    chip.className='role-card placed';
    chip.style.cursor='default';
    chip.innerHTML = `<span class="emoji">${role.emoji}</span><span class="name">${role.name}</span>`;
    zone.appendChild(chip);
    submitBtn.disabled = false;
  }
}

function submitStage1(){
  if(!state.s1Placed || state.answered) return;
  state.answered = true;
  const item = STAGE1[state.s1Index % STAGE1.length];
  const correct = state.s1Placed === item.owner;
  state.scoreMax.ownership += 10;
  state.scoreMax.delegation += 5;
  if(correct){ state.scores.ownership += 10; }
  else { state.scores.ownership += 3; state.overAssignCount += (state.s1Placed==='manager'||state.s1Placed==='owner') ? 1:0; }
  // delegation credit: did they at least engage plausibly (assist list overlap)
  if(item.assist.includes(state.s1Placed) || correct) state.scores.delegation += 5;
  else state.scores.delegation += 1;

  const feedback = document.getElementById('feedbackArea');
  const ownerRole = R(item.owner);
  const pickedRole = R(state.s1Placed);
  feedback.innerHTML = `
    <div class="feedback">
      <h3>${correct ? '✓ Primary Owner confirmed' : '↺ A different owner usually leads this'}</h3>
      <div class="row"><b>Primary Owner:</b> ${ownerRole.emoji} ${ownerRole.name} ${correct ? `(your pick)` : `— you chose ${pickedRole.emoji} ${pickedRole.name}`}</div>
      <div class="row"><b>Why:</b> ${item.why}</div>
      <div class="row"><b>Roles who may assist:</b></div>
      <div class="assist-tags">${item.assist.map(id=>{const r=R(id); return `<span>${r.emoji} ${r.name}</span>`}).join('')}</div>
    </div>
    <div class="btn-row"><button class="primary" onclick="nextStage1()">Continue →</button></div>
  `;
  document.getElementById('submitBtn').style.display='none';
  document.querySelectorAll('#roleGrid .role-card').forEach(c=>c.draggable=false);
}

function nextStage1(){
  state.s1Index++;
  state.answered = false;
  state.s1Placed = null;
  if(state.s1Index >= 3){
    state.screen='stage2'; state.s2Selection=[]; state.answered=false;
    renderStage2();
  } else {
    renderStage1();
  }
}

/* ======================= STAGE 2 ======================= */
function renderStage2(){
  const item = STAGE2[state.s2Index % STAGE2.length];
  app.innerHTML = `
    ${header(`Stage 2 · Task Routing · ${state.s2Index+1} / 3`)}
    <div class="panel">
      <div class="ticket"><p>${item.task}</p></div>
      <p style="color:rgba(243,230,211,0.55); font-size:0.85rem; margin-top:0;">Build the order this task should move through the team. Click roles in sequence (at least ${item.minLen} steps).</p>
      <div class="role-grid" id="roleGrid2">
        ${ROLES.map(r=>roleCardHTML(r,'',false)).join('')}
      </div>
      <div class="workflow-track" id="workflowTrack">
        <span class="hint" id="wfHint">Click roles above to build the workflow →</span>
      </div>
      <div class="btn-row">
        <button class="ghost" onclick="clearStage2()">Clear</button>
        <button class="primary" id="submit2Btn" disabled onclick="submitStage2()">Submit Workflow</button>
      </div>
      <div id="feedbackArea2"></div>
    </div>
  `;
  setupStage2Click(item);
}

function setupStage2Click(item){
  const grid = document.getElementById('roleGrid2');
  grid.querySelectorAll('.role-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      if(state.answered) return;
      state.s2Selection.push(card.dataset.role);
      renderWorkflowTrack(item);
    });
  });
}

function renderWorkflowTrack(item){
  const track = document.getElementById('workflowTrack');
  if(state.s2Selection.length===0){
    track.innerHTML = `<span class="hint">Click roles above to build the workflow →</span>`;
  } else {
    track.innerHTML = state.s2Selection.map((id,i)=>{
      const r = R(id);
      const arrow = i>0 ? `<span class="arrow">→</span>` : '';
      return `${arrow}<span class="step-chip">${r.emoji} ${r.name} <span class="remove-x" onclick="removeStep2(${i})">✕</span></span>`;
    }).join('');
  }
  document.getElementById('submit2Btn').disabled = state.s2Selection.length < item.minLen;
}
function removeStep2(i){ state.s2Selection.splice(i,1); renderWorkflowTrack(STAGE2[state.s2Index % STAGE2.length]); }
function clearStage2(){ state.s2Selection=[]; renderWorkflowTrack(STAGE2[state.s2Index % STAGE2.length]); }

function submitStage2(){
  if(state.answered) return;
  state.answered = true;
  const item = STAGE2[state.s2Index % STAGE2.length];
  const picked = state.s2Selection;
  // score: fraction of correct-sequence roles present in right relative order (simple overlap + order heuristic)
  let orderScore = 0;
  let lastIdx = -1;
  let matched = 0;
  picked.forEach(id=>{
    const idx = item.correct.indexOf(id);
    if(idx>=0){ matched++; if(idx>=lastIdx){ orderScore++; lastIdx = idx; } }
  });
  const workflowPts = Math.round((orderScore / item.correct.length) * 10);
  state.scoreMax.workflow += 10;
  state.scores.workflow += Math.min(workflowPts,10);
  state.scoreMax.delegation += 5;
  state.scores.delegation += matched>=2 ? 5 : 2;

  document.getElementById('submit2Btn').style.display='none';
  document.querySelectorAll('#roleGrid2 .role-card').forEach(c=>c.style.pointerEvents='none');

  const feedback = document.getElementById('feedbackArea2');
  feedback.innerHTML = `
    <div class="feedback">
      <h3>Watch it move through the team</h3>
      <div class="flow-anim" id="flowAnim"></div>
      <div class="row" style="margin-top:16px;"><b>A common path:</b></div>
      <div class="row">${item.correct.map(id=>R(id).name).join(' → ')}</div>
      <div class="row"><b>Why this order works:</b> ${item.why}</div>
    </div>
    <div class="btn-row"><button class="primary" onclick="nextStage2()">Continue →</button></div>
  `;
  animateFlow(item.correct);
}

function animateFlow(sequence){
  const holder = document.getElementById('flowAnim');
  sequence.forEach((id,i)=>{
    const r = R(id);
    if(i>0){
      const arrow = document.createElement('span');
      arrow.className='arrow';
      arrow.textContent='→';
      arrow.style.animationDelay = `${i*0.25}s`;
      holder.appendChild(arrow);
    }
    const node = document.createElement('span');
    node.className='node';
    node.textContent = `${r.emoji} ${r.name}`;
    node.style.animationDelay = `${i*0.25+0.1}s`;
    holder.appendChild(node);
  });
}

function nextStage2(){
  state.s2Index++;
  state.answered = false;
  state.s2Selection = [];
  if(state.s2Index >= 3){
    state.screen='stage3'; state.s3Selection=[]; state.answered=false;
    renderStage3();
  } else {
    renderStage2();
  }
}

/* ======================= STAGE 3 ======================= */
function renderStage3(){
  const item = STAGE3[state.s3Index % STAGE3.length];
  app.innerHTML = `
    ${header(`Stage 3 · Collaboration Challenge · ${state.s3Index+1} / 3`)}
    <div class="panel">
      <div class="ticket"><p>${item.scenario}</p></div>
      <p style="color:rgba(243,230,211,0.55); font-size:0.85rem; margin-top:0;">Select up to 4 roles who should be involved in solving this.</p>
      <div class="role-grid" id="roleGrid3">
        ${ROLES.map(r=>roleCardHTML(r,'',false)).join('')}
      </div>
      <div class="collab-counter" id="collabCounter">0 / 4 selected</div>
      <div class="btn-row">
        <button class="primary" id="submit3Btn" disabled onclick="submitStage3()">Submit Team</button>
      </div>
      <div id="feedbackArea3"></div>
    </div>
  `;
  setupStage3Click();
}

function setupStage3Click(){
  const grid = document.getElementById('roleGrid3');
  grid.querySelectorAll('.role-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      if(state.answered) return;
      const id = card.dataset.role;
      const idx = state.s3Selection.indexOf(id);
      if(idx>=0){
        state.s3Selection.splice(idx,1);
        card.classList.remove('collab-selected');
      } else {
        if(state.s3Selection.length>=4) return;
        state.s3Selection.push(id);
        card.classList.add('collab-selected');
      }
      document.getElementById('collabCounter').textContent = `${state.s3Selection.length} / 4 selected`;
      document.getElementById('submit3Btn').disabled = state.s3Selection.length===0;
    });
  });
}

function submitStage3(){
  if(state.answered) return;
  state.answered = true;
  const item = STAGE3[state.s3Index % STAGE3.length];
  const picked = state.s3Selection;
  const hitPrimary = picked.includes(item.primary);
  const supportOverlap = picked.filter(id=>item.supporting.includes(id)).length;

  state.scoreMax.collaboration += 10;
  state.scoreMax.ownership += 5;
  let collabPts = supportOverlap * 2.5;
  if(picked.length===1) { collabPts = Math.min(collabPts,3); state.underCollabCount++; }
  state.scores.collaboration += Math.min(collabPts,10);
  state.scores.ownership += hitPrimary ? 5 : 2;

  document.getElementById('submit3Btn').style.display='none';
  document.querySelectorAll('#roleGrid3 .role-card').forEach(c=>c.style.pointerEvents='none');

  const feedback = document.getElementById('feedbackArea3');
  feedback.innerHTML = `
    <div class="feedback">
      <h3>Team assembled</h3>
      <div class="row"><b>Primary Owner:</b> ${R(item.primary).emoji} ${R(item.primary).name}</div>
      <div class="row"><b>Supporting Teams:</b></div>
      <div class="assist-tags">${item.supporting.map(id=>{const r=R(id); return `<span>${r.emoji} ${r.name}</span>`}).join('')}</div>
      <div class="row"><b>Reasoning:</b> ${item.reasoning}</div>
      <div class="row"><b>Possible Communication Flow:</b> ${item.flow}</div>
    </div>
    <div class="btn-row"><button class="primary" onclick="nextStage3()">Continue →</button></div>
  `;
}

function nextStage3(){
  state.s3Index++;
  state.answered = false;
  state.s3Selection = [];
  if(state.s3Index >= 3){
    state.screen='results';
    renderResults();
  } else {
    renderStage3();
  }
}

/* ======================= RESULTS ======================= */
function pct(cat){
  const max = state.scoreMax[cat] || 1;
  return Math.round((state.scores[cat]/max)*100);
}

function renderResults(){
  const cats = [
    {key:'ownership', label:'Ownership', color:'var(--gold)'},
    {key:'delegation', label:'Delegation', color:'var(--steam)'},
    {key:'collaboration', label:'Collaboration', color:'var(--clay)'},
    {key:'workflow', label:'Workflow Thinking', color:'var(--plum)'}
  ];
  app.innerHTML = `
    ${header()}
    <div class="panel">
      <h2 style="font-family:Georgia,serif; margin-top:0;">Your Shift Debrief</h2>
      <p style="color:rgba(243,230,211,0.6); font-size:0.9rem;">Not a score — a snapshot of how you think about ownership and teamwork.</p>
      <div class="chart">
        ${cats.map(c=>`
          <div class="bar-row">
            <span class="label">${c.label}</span>
            <div class="bar-track"><div class="bar-fill" id="bar-${c.key}" style="background:${c.color};"></div></div>
            <span class="pct" id="pct-${c.key}">0%</span>
          </div>
        `).join('')}
      </div>

      <div class="reflection-grid">
        <div class="reflect-card">
          <h4>👍 What you understood well</h4>
          <p>${understoodWell()}</p>
        </div>
        <div class="reflect-card">
          <h4>⚖️ Where you over-assigned</h4>
          <p>${overAssigned()}</p>
        </div>
        <div class="reflect-card">
          <h4>🤝 Where you underestimated collaboration</h4>
          <p>${underCollab()}</p>
        </div>
        <div class="reflect-card">
          <h4>💡 One insight</h4>
          <p>${randomInsight()}</p>
        </div>
      </div>

      <div class="insight-banner">"Many real workplace problems are solved by teams rather than individuals."</div>

      <div class="btn-row" style="justify-content:center;">
        <button class="primary" onclick="restartGame()">Run Another Shift ↻</button>
      </div>
    </div>
    <p class="restart-note">Task Compass · Café Edition · offline single-file app</p>
  `;
  requestAnimationFrame(()=>{
    cats.forEach(c=>{
      const p = pct(c.key);
      document.getElementById(`bar-${c.key}`).style.width = p+'%';
      document.getElementById(`pct-${c.key}`).textContent = p+'%';
    });
  });
  launchConfetti();
}

function understoodWell(){
  const best = ['ownership','delegation','collaboration','workflow'].sort((a,b)=>pct(b)-pct(a))[0];
  const map = {
    ownership:"You consistently identified who is closest to a problem — a strong instinct for accountability.",
    delegation:"You recognized when a task needed to move beyond the obvious owner to someone who could actually help.",
    collaboration:"You tended to bring in the right mix of supporting roles rather than isolating a problem to one person.",
    workflow:"You sequenced tasks in an order that mirrors how information realistically travels through a team."
  };
  return map[best];
}
function overAssigned(){
  if(state.overAssignCount===0) return "You rarely defaulted to management or ownership when a frontline role was better positioned to own the task.";
  return "In a few tickets, you leaned on the manager or owner even when a frontline role (like the barista or server) was actually closest to the issue. This is common — it often feels safer, but it can slow things down.";
}
function underCollab(){
  if(state.underCollabCount===0) return "You generally avoided assigning big, cross-functional problems to a single role — good instinct.";
  return "On at least one larger scenario, you assigned just one role to a problem that usually needs input from multiple teams. Complex issues like satisfaction drops or PR moments rarely have a single owner.";
}
function randomInsight(){
  const insights = [
    "Ownership doesn't mean working alone — it usually means coordinating the people who can actually fix things.",
    "The person who notices a problem first isn't always the person who should own solving it.",
    "Workflows exist so that no single person becomes a bottleneck for the whole team.",
    "The bigger the impact of a problem, the more likely it needs several perspectives, not one decision-maker."
  ];
  return insights[Math.floor(Math.random()*insights.length)];
}

function launchConfetti(){
  const colors = ['#d9a441','#c1613f','#7fb8a8','#8a5a8f','#f3e6d3'];
  for(let i=0;i<26;i++){
    const el = document.createElement('div');
    el.className='confetti';
    el.style.left = Math.random()*100+'vw';
    el.style.width = el.style.height = (5+Math.random()*6)+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}

function restartGame(){
  state = {
    screen:'intro', stage:1, s1Index:0, s2Index:0, s3Index:0,
    scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
    scoreMax:{ownership:0, delegation:0, collaboration:0, workflow:0},
    overAssignCount:0, underCollabCount:0,
    s2Selection:[], s3Selection:[], s1Placed:null, answered:false
  };
  renderIntro();
}

/* ======================= INIT ======================= */
renderIntro();
</script>
</body>
</html>
